[package]
name = "stm32f4-bench"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "ChaosSeal Cortex-M4F hardware benchmark: Q32.32 RK4 epoch stepping, Lyapunov monitoring, HKDF/AES-GCM/HMAC per-packet cost. Runs the core_v2 sources verbatim."

[dependencies]
cortex-m = "0.7"
cortex-m-rt = "0.7"
cortex-m-semihosting = "0.5"
panic-semihosting = { version = "0.6", features = ["exit"] }
linked_list_allocator = "0.10"

# Crypto pinned to core_v2/Cargo.lock versions (aes 0.8.4, aes-gcm 0.10.3,
# hkdf 0.12.4, hmac 0.12.1, sha2 0.10.9, zeroize 1.9.0). std features off.
aes = { version = "0.8.4", default-features = false }
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "alloc"] }
ctr = { version = "0.9.2", default-features = false }
hkdf = { version = "0.12.4", default-features = false }
libm = "0.2"  # pure-Rust f64 exp/ln/atan2 (core f64 float math is std-gated)
hmac = { version = "0.12.1", default-features = false }
sha2 = { version = "0.10.9", default-features = false }
zeroize = { version = "1.9.0", default-features = false, features = ["alloc", "derive"] }

# Standalone crate: deliberately NOT in the repo-root workspace (whose
# member is the legacy `core` crate). Keeps the firmware dependency tree
# and lockfile isolated from the host builds.
[workspace]

[[bin]]
name = "stm32f4-bench"
path = "src/main.rs"
