# Capture the ChaosSeal bench log from SRAM2 on the STM32F4 Discovery.
#
# Firmware (feature `hw`) mirrors its console lines into the reserved region
# at 0x2001C000 and publishes a header (magic "CSBL", status, length) —
# schema in memory.x and scripts/parse_bench_dump.py. This script resets the
# board, lets it run, polls the status word, halts on completion, and dumps
# the region for scripts/parse_bench_dump.py.
#
# Usage (host with st-flash + openocd, ST-LINK attached):
#   st-flash write firmware/stm32f4-bench/bench.bin 0x08000000
#   openocd -f firmware/stm32f4-bench/openocd-capture.cfg
#   python3 scripts/parse_bench_dump.py --json firmware/stm32f4-bench/bench_hw.json

source [find interface/stlink.cfg]
source [find target/stm32f4x.cfg]
adapter speed 1000

# SRAM2 bench-log region (see firmware/stm32f4-bench/memory.x)
set LOG_BASE  0x2001C000
set LOG_MAGIC 0x4353424C ;# "CSBL" little-endian
set DUMP      /tmp/chaosseal_bench_dump.bin

init
reset halt
reset run

# Poll: halt for a coherent header snapshot (the firmware DCache-cleans the
# log body before publishing the status word, so a halted read is exact).
# NOTE: `mdw addr n` prints "<addr>: w0 w1 w2" — token 0 is the address
# label, data words start at token 1.
set magic 0
set status 0
set len 0
for {set i 0} {$i < 300} {incr i} {
    sleep 100
    halt
    set toks [split [mdw $LOG_BASE 3]]
    resume
    # mdw emits hex strings; convert to integers for comparison.
    scan [lindex $toks 1] %x magic
    scan [lindex $toks 2] %x status
    scan [lindex $toks 3] %x len
    if {$magic == $LOG_MAGIC && $status != 0} { break }
}

if {$magic != $LOG_MAGIC || $status == 0} {
    puts "ERROR: bench-log done flag never set (magic=$magic status=$status)"
    shutdown
} else {
    halt
    if {$len > 4096} { set len 4096 }
    dump_image $DUMP $LOG_BASE [expr {16 + $len}]
    resume
    puts "bench-log captured: status=$status len=$len -> $DUMP"
    shutdown
}
