[package]
name = "chaosseal-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "ChaosSeal protocol engine: fixed-point kinematics, Lyapunov validation, AEAD crypto, BEE revocation"

[dependencies]
aes-gcm = { version = "0.10.3", features = ["zeroize"] }
aes = { version = "0.8", features = ["zeroize"] }
ctr = { version = "0.9", features = ["zeroize"] }
generic-array = "0.14"
hkdf = "0.12"
hmac = "0.12"
sha2 = { version = "0.10", features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
rand = { version = "0.8", features = ["std", "getrandom"] }
rand_chacha = "0.3"
zeroize = { version = "1.7", features = ["derive"] }
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
hex = "0.4"

[build-dependencies]
cbindgen = "0.26"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "chaosseal"
path = "src/bin/cli.rs"

[workspace]
[[bin]]
name = "test_gcm"
path = "src/bin/test_gcm.rs"
[[bin]]
name = "test_rk4"
path = "src/bin/test_rk4.rs"
